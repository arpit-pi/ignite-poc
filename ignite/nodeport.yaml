apiVersion: v1
kind: Service
metadata:
  name: ignite-nodeport-service
  namespace: ignite
  labels:
    app: ignite
spec:
  type: NodePort
  ports:
    - name: rest
      port: 8080
      targetPort: 8080
    - name: thinclients
      port: 10800
      targetPort: 10800
  selector:
    labels:
      app: ignite
